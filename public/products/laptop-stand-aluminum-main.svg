<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="alum-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <linearGradient id="dark-alum" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="stand-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <g filter="url(#stand-shadow)" transform="translate(80, 45)">
    
    <ellipse cx="120" cy="200" rx="95" ry="24" fill="url(#alum-grad)" stroke="#CBD5E1" stroke-width="1.5" />
    <ellipse cx="120" cy="198" rx="75" ry="18" fill="#1E293B" opacity="0.15" />
    <circle cx="120" cy="198" r="14" fill="#334155" stroke="#94A3B8" stroke-width="1" />
    <text x="120" y="201" font-size="6" fill="#F8FAFC" font-family="monospace" text-anchor="middle">360°</text>

    
    <rect x="75" y="115" width="16" height="85" rx="8" fill="url(#dark-alum)" transform="rotate(-15 75 115)" stroke="#64748B" stroke-width="1" />
    <rect x="145" y="115" width="16" height="85" rx="8" fill="url(#dark-alum)" transform="rotate(-15 145 115)" stroke="#64748B" stroke-width="1" />

    
    <polygon points="20,40 220,40 205,130 35,130" fill="url(#alum-grad)" stroke="#F1F5F9" stroke-width="1.5" />

    
    <rect x="55" y="55" width="20" height="50" rx="6" fill="#0F172A" />
    <rect x="85" y="55" width="20" height="50" rx="6" fill="#0F172A" />
    <rect x="115" y="55" width="20" height="50" rx="6" fill="#0F172A" />
    <rect x="145" y="55" width="20" height="50" rx="6" fill="#0F172A" />
    <rect x="175" y="55" width="20" height="50" rx="6" fill="#0F172A" />

    
    <path d="M40 120 L40 145 Q40 152 48 152 L60 152" stroke="#0F172A" stroke-width="8" stroke-linecap="round" fill="none" />
    <path d="M180 120 L180 145 Q180 152 188 152 L200 152" stroke="#0F172A" stroke-width="8" stroke-linecap="round" fill="none" />
