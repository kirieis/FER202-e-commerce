<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="k2-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3F3F46" />
      <stop offset="50%" stop-color="#27272A" />
      <stop offset="100%" stop-color="#18181B" />
    </linearGradient>
    <filter id="k2-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <g filter="url(#k2-shadow)" transform="translate(50, 70)">
    <!-- Keychron K2 75% Compact Aluminum Case Frame -->
    <rect x="0" y="0" width="300" height="150" rx="14" fill="url(#k2-frame)" stroke="#52525B" stroke-width="1.5" />

    <!-- Keycap Tray -->
    <rect x="8" y="8" width="284" height="134" rx="8" fill="#18181B" />

    <!-- ESC Key (Orange) -->
    <rect x="12" y="12" width="18" height="18" rx="4" fill="#EA580C" stroke="#C2410C" stroke-width="1" />
    <text x="21" y="24" font-size="7" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" text-anchor="middle">ESC</text>

    <!-- F-Row 75% Compact -->
    <g fill="#3F3F46" stroke="#27272A" stroke-width="0.8">
      <rect x="33" y="12" width="16" height="18" rx="3" />
      <rect x="51" y="12" width="16" height="18" rx="3" />
      <rect x="69" y="12" width="16" height="18" rx="3" />
      <rect x="87" y="12" width="16" height="18" rx="3" />

      <rect x="107" y="12" width="16" height="18" rx="3" />
      <rect x="125" y="12" width="16" height="18" rx="3" />
      <rect x="143" y="12" width="16" height="18" rx="3" />
      <rect x="161" y="12" width="16" height="18" rx="3" />

      <rect x="181" y="12" width="16" height="18" rx="3" />
      <rect x="199" y="12" width="16" height="18" rx="3" />
      <rect x="217" y="12" width="16" height="18" rx="3" />
      <rect x="235" y="12" width="16" height="18" rx="3" />

      <rect x="255" y="12" width="15" height="18" rx="3" fill="#EA580C" />
      <rect x="272" y="12" width="15" height="18" rx="3" fill="#52525B" />
    </g>

    <!-- Number Row -->
    <g fill="#27272A" stroke="#18181B" stroke-width="0.8">
      <rect x="12" y="34" width="16" height="18" rx="3" fill="#52525B" />
      <rect x="30" y="34" width="16" height="18" rx="3" />
      <rect x="48" y="34" width="16" height="18" rx="3" />
      <rect x="66" y="34" width="16" height="18" rx="3" />
      <rect x="84" y="34" width="16" height="18" rx="3" />
      <rect x="102" y="34" width="16" height="18" rx="3" />
      <rect x="120" y="34" width="16" height="18" rx="3" />
      <rect x="138" y="34" width="16" height="18" rx="3" />
      <rect x="156" y="34" width="16" height="18" rx="3" />
      <rect x="174" y="34" width="16" height="18" rx="3" />
      <rect x="192" y="34" width="16" height="18" rx="3" />
      <rect x="210" y="34" width="16" height="18" rx="3" />
      <rect x="228" y="34" width="16" height="18" rx="3" />
      <rect x="246" y="34" width="23" height="18" rx="3" fill="#52525B" />
      <rect x="272" y="34" width="15" height="18" rx="3" fill="#3F3F46" />
    </g>

    <!-- QWERTY Row -->
    <g fill="#27272A" stroke="#18181B" stroke-width="0.8">
      <rect x="12" y="56" width="24" height="18" rx="3" fill="#52525B" />
      <rect x="38" y="56" width="16" height="18" rx="3" />
      <rect x="56" y="56" width="16" height="18" rx="3" />
      <rect x="74" y="56" width="16" height="18" rx="3" />
      <rect x="92" y="56" width="16" height="18" rx="3" />
      <rect x="110" y="56" width="16" height="18" rx="3" />
      <rect x="128" y="56" width="16" height="18" rx="3" />
      <rect x="146" y="56" width="16" height="18" rx="3" />
      <rect x="164" y="56" width="16" height="18" rx="3" />
      <rect x="182" y="56" width="16" height="18" rx="3" />
      <rect x="200" y="56" width="16" height="18" rx="3" />
      <rect x="218" y="56" width="16" height="18" rx="3" />
      <rect x="236" y="56" width="33" height="18" rx="3" fill="#EA580C" />
      <text x="252" y="68" font-size="7" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" text-anchor="middle">ENTER</text>
      <rect x="272" y="56" width="15" height="18" rx="3" fill="#3F3F46" />
    </g>

    <!-- ASDF Row -->
    <g fill="#27272A" stroke="#18181B" stroke-width="0.8">
      <rect x="12" y="78" width="30" height="18" rx="3" fill="#52525B" />
      <rect x="44" y="78" width="16" height="18" rx="3" />
      <rect x="62" y="78" width="16" height="18" rx="3" />
      <rect x="80" y="78" width="16" height="18" rx="3" />
      <rect x="98" y="78" width="16" height="18" rx="3" />
      <rect x="116" y="78" width="16" height="18" rx="3" />
      <rect x="134" y="78" width="16" height="18" rx="3" />
      <rect x="152" y="78" width="16" height="18" rx="3" />
      <rect x="170" y="78" width="16" height="18" rx="3" />
      <rect x="188" y="78" width="16" height="18" rx="3" />
      <rect x="206" y="78" width="16" height="18" rx="3" />
      <rect x="224" y="78" width="26" height="18" rx="3" fill="#52525B" />
      <rect x="253" y="78" width="16" height="18" rx="3" fill="#EA580C" />
      <rect x="272" y="78" width="15" height="18" rx="3" fill="#3F3F46" />
    </g>

    <!-- Bottom Modifier Row & Nav -->
    <g fill="#52525B" stroke="#27272A" stroke-width="0.8">
      <rect x="12" y="100" width="20" height="20" rx="3" />
      <rect x="34" y="100" width="18" height="20" rx="3" />
      <rect x="54" y="100" width="20" height="20" rx="3" />
      <rect x="76" y="100" width="105" height="20" rx="4" fill="#27272A" />
      <rect x="183" y="100" width="18" height="20" rx="3" />
      <rect x="203" y="100" width="18" height="20" rx="3" />
      <!-- Arrow Keys -->
      <rect x="223" y="100" width="16" height="20" rx="3" fill="#3F3F46" />
      <rect x="241" y="100" width="16" height="20" rx="3" fill="#3F3F46" />
      <rect x="259" y="100" width="16" height="20" rx="3" fill="#3F3F46" />
      <rect x="277" y="100" width="15" height="20" rx="3" fill="#3F3F46" />
    </g>
  </g>
</svg>
