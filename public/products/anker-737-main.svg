<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D323E" />
      <stop offset="50%" stop-color="#1E222B" />
      <stop offset="100%" stop-color="#14171E" />
    </linearGradient>
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1D" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#6F5CFF" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  
  <g filter="url(#shadow)" transform="translate(130, 25)">
    
    <rect x="0" y="0" width="140" height="235" rx="22" fill="url(#body-grad)" stroke="#3D4454" stroke-width="1.5" />

    
    <rect x="14" y="10" width="112" height="34" rx="8" fill="#14161F" />
    
    <rect x="25" y="20" width="22" height="12" rx="4" fill="#0C0E14" stroke="#00F0FF" stroke-width="1" />
    <text x="36" y="28" font-size="6" fill="#00F0FF" font-family="monospace" text-anchor="middle" font-weight="bold">C1</text>
    
    <rect x="59" y="20" width="22" height="12" rx="4" fill="#0C0E14" stroke="#00F0FF" stroke-width="1" />
    <text x="70" y="28" font-size="6" fill="#00F0FF" font-family="monospace" text-anchor="middle" font-weight="bold">C2</text>
    
    <rect x="93" y="19" width="22" height="14" rx="3" fill="#0C0E14" stroke="#4A5568" stroke-width="1" />
    <rect x="97" y="22" width="14" height="4" rx="1" fill="#00F0FF" />

    
    <rect x="16" y="56" width="108" height="96" rx="14" fill="url(#screen-grad)" stroke="#222838" stroke-width="1.5" />
    <circle cx="70" cy="92" r="28" stroke="#1A2234" stroke-width="5" fill="none" />
    <circle cx="70" cy="92" r="28" stroke="url(#glow-grad)" stroke-width="5" fill="none" stroke-dasharray="140" stroke-dashoffset="35" stroke-linecap="round" />
    <text x="70" y="94" font-size="16" fill="#FFFFFF" font-family="monospace" font-weight="bold" text-anchor="middle">98%</text>
    <text x="70" y="106" font-size="8" fill="#00F0FF" font-family="monospace" text-anchor="middle">140W MAX</text>

    
    <text x="26" y="136" font-size="7" fill="#8892B0" font-family="monospace">OUT 1: 96.5W</text>
    <text x="26" y="146" font-size="7" fill="#8892B0" font-family="monospace">OUT 2: 24.0W</text>

    
    <line x1="28" y1="170" x2="28" y2="215" stroke="#252A38" stroke-width="2" stroke-linecap="round" />
    <line x1="42" y1="170" x2="42" y2="215" stroke="#252A38" stroke-width="2" stroke-linecap="round" />
    <line x1="56" y1="170" x2="56" y2="215" stroke="#252A38" stroke-width="2" stroke-linecap="round" />
    <line x1="70" y1="170" x2="70" y2="215" stroke="#252A38" stroke-width="2" stroke-linecap="round" />
    <line x1="84" y1="170" x2="84" y2="215" stroke="#252A38" stroke-width="2" stroke-linecap="round" />
    <line x1="98" y1="170" x2="98" y2="215" stroke="#252A38" stroke-width="2" stroke-linecap="round" />
