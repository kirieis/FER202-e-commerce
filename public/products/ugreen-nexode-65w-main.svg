      <stop offset="100%" stop-color="#12141A" />
    </linearGradient>
    <filter id="charger-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <g filter="url(#charger-shadow)" transform="translate(130, 45)">
    
    <rect x="0" y="0" width="140" height="190" rx="20" fill="url(#ugreen-body)" stroke="#454C5E" stroke-width="1.5" />

    
    <rect x="14" y="14" width="112" height="162" rx="14" fill="url(#matte-plate)" stroke="#2B303D" stroke-width="1" />

    
    <g transform="translate(42, 28)">
      <rect x="0" y="0" width="56" height="24" rx="8" fill="#0C0E14" stroke="#6F5CFF" stroke-width="1.2" />
      <rect x="12" y="8" width="32" height="8" rx="3" fill="#1A1E29" />
      <text x="28" y="32" font-size="7" fill="#8E9AA8" font-family="monospace" text-anchor="middle">USB-C1 65W</text>
    </g>

    
    <g transform="translate(42, 70)">
