      <stop offset="0%" stop-color="#3A3F4D" />
      <stop offset="50%" stop-color="#242833" />
      <stop offset="100%" stop-color="#181B22" />
    </linearGradient>
    <linearGradient id="matte-plate" x1="0%" y1="0%" x2="0%" y2="100%">
