    <line x1="24" y1="124" x2="256" y2="124" stroke="#1E222B" stroke-width="1" />
    <line x1="24" y1="144" x2="256" y2="144" stroke="#1E222B" stroke-width="1" />

    
    <text x="24" y="174" font-size="12" fill="#E2E8F0" font-family="sans-serif" font-weight="900" letter-spacing="1">Baseus</text>
