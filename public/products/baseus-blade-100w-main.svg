<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blade-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242831" />
      <stop offset="60%" stop-color="#181B22" />
      <stop offset="100%" stop-color="#0E1015" />
    </linearGradient>
    <filter id="blade-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <g filter="url(#blade-shadow)" transform="translate(60, 45)">
    
    <rect x="0" y="0" width="280" height="195" rx="16" fill="url(#blade-body)" stroke="#373D4D" stroke-width="1.5" />

    
    <rect x="8" y="8" width="264" height="179" rx="10" fill="none" stroke="#252A36" stroke-width="1" />

    
