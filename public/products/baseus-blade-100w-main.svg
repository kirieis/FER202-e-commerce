    <text x="218" y="46" font-size="14" fill="#FF8A4C" font-family="monospace" font-weight="bold" text-anchor="middle">100%</text>
    <text x="218" y="58" font-size="7" fill="#8892B0" font-family="monospace" text-anchor="middle">100W PD</text>

    
    <rect x="24" y="28" width="20" height="10" rx="3" fill="#0C0E14" stroke="#4B5568" stroke-width="1" />
    <rect x="52" y="28" width="20" height="10" rx="3" fill="#0C0E14" stroke="#4B5568" stroke-width="1" />
    <rect x="82" y="27" width="20" height="12" rx="2" fill="#0C0E14" stroke="#F59E0B" stroke-width="1" />
