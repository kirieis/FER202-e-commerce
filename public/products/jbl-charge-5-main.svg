<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="charge-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="40%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="jbl-badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#D9480F" />
    </linearGradient>
    <filter id="speaker-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <g filter="url(#speaker-shadow)" transform="translate(60, 65)">
    
    <rect x="30" y="30" width="220" height="110" rx="30" fill="url(#charge-body)" stroke="#475569" stroke-width="2" />

    
    <ellipse cx="30" cy="85" rx="14" ry="46" fill="#0F172A" stroke="#FF6B35" stroke-width="2.5" />
    <ellipse cx="250" cy="85" rx="14" ry="46" fill="#0F172A" stroke="#FF6B35" stroke-width="2.5" />
    <circle cx="250" cy="85" r="7" fill="#FF6B35" />
    <circle cx="30" cy="85" r="7" fill="#FF6B35" />

    
    <g opacity="0.15" stroke="#FFFFFF" stroke-width="1">
      <line x1="50" y1="40" x2="50" y2="130" />
      <line x1="70" y1="35" x2="70" y2="135" />
      <line x1="90" y1="32" x2="90" y2="138" />
      <line x1="190" y1="32" x2="190" y2="138" />
      <line x1="210" y1="35" x2="210" y2="135" />
      <line x1="230" y1="40" x2="230" y2="130" />
    </g>

    
    <rect x="100" y="55" width="80" height="60" rx="12" fill="url(#jbl-badge)" stroke="#FFFFFF" stroke-width="1" />
    <text x="140" y="97" font-size="28" fill="#FFFFFF" font-family="sans-serif" font-weight="900" letter-spacing="1" text-anchor="middle">JBL</text>

    
    <g transform="translate(90, 18)" fill="#94A3B8">
      <circle cx="20" cy="0" r="5" />
      <circle cx="40" cy="0" r="5" />
      <circle cx="60" cy="0" r="7" fill="#FF6B35" />
      <circle cx="80" cy="0" r="5" />
      <circle cx="100" cy="0" r="5" />
    </g>

    
    <g stroke="#FF6B35" stroke-width="2.5" stroke-linecap="round">
      <line x1="75" y1="140" x2="85" y2="150" />
      <line x1="95" y1="140" x2="105" y2="150" />
      <line x1="115" y1="140" x2="125" y2="150" />
      <line x1="135" y1="140" x2="145" y2="150" />
      <line x1="155" y1="140" x2="165" y2="150" />
      <line x1="175" y1="140" x2="185" y2="150" />
      <line x1="195" y1="140" x2="205" y2="150" />
    </g>
